<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkillCraft To-Do</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <header>
            <h1>My Tasks</h1>
            <p>Organize your day, achieve your goals.</p>
        </header>
        
        <main>
            <section class="task-input-section">
                <form id="task-form">
                    <div class="input-group">
                        <input type="text" id="task-name" placeholder="What needs to be done?" required autocomplete="off">
                    </div>
                    <div class="datetime-group">
                        <input type="datetime-local" id="task-datetime" required>
                        <button type="submit" id="add-btn">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                            Add
                        </button>
                    </div>
                </form>
            </section>

            <section class="task-list-section">
                <div class="list-header">
                    <h2>Tasks</h2>
                    <span id="task-count">0 tasks</span>
                </div>
                <ul id="task-list">
                    <!-- Tasks will be injected here via JS -->
                </ul>
            </section>
        </main>
    </div>

    <!-- Edit Task Modal -->
    <div class="modal-overlay" id="edit-modal">
        <div class="modal-content">
            <h2>Edit Task</h2>
            <form id="edit-form">
                <input type="hidden" id="edit-id">
                <div class="input-group">
                    <label for="edit-name">Task</label>
                    <input type="text" id="edit-name" required>
                </div>
                <div class="input-group">
                    <label for="edit-datetime">Date & Time</label>
                    <input type="datetime-local" id="edit-datetime" required>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn-cancel" id="cancel-edit-btn">Cancel</button>
                    <button type="submit" class="btn-save">Save Changes</button>
                </div>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
